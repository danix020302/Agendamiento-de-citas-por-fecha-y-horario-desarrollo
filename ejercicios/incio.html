<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Agendamiento de Citas</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Sistema de agendamiento de Citas</h1>
            <p class="subtitulo">Ingresa tu nombre, selecciona fecha y hora disponible</p>
        </header>
        <main class="contenedor">
            <section class="formulario">
                <h2>Nueva Cita</h2>

                <div class="campo">
                    <label for="nombre">Nombre de la persona</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="campo">
                    <label for="doctor">Nombre del doctor</label>
                    <select id="doctor" required>
                        <option value="">Por favor seleccionar un doctor</option>
                        <option value="Alejandro">Alejandro</option>
                        <option value="Felipe">Felipe</option>
                        <option value="Nicolas">Nicolas</option>
                        <option value="Nicol">Nicol</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="campo">
                    <label for="hora">Hora:</label>
                    <select  id="hora" required>
                        <option value="">Por favor seleccionar una hora</option>
                        <option value="08:00">08:00 AM</option>
                        <option value="09:00">09:00 AM</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="11:00">11:00 AM</option>
                        <option value="14:00">02:00 PM</option>
                        <option value="15:00">03:00 PM</option>
                        <option value="16:00">04:00 PM</option>
                        <option value="17:00">05:00 PM</option>
                    </select>
                </div>

                <button type="button" onclick="agendarCita()">Agendar Cita</button>
                <p id="mensaje" class="mensaje"></p>
            </section>

            <!--citas agendadas-->
            <section class="lista-citas">
                <h2>Citas Agendadas</h2>
                <div class="acciones">
                    <button type="button" id="btnOrden" onclick="cambiarOrden()">Ver más recientes primero</button>
                </div>
                <ul id="listaCitas">
                    <li class="vacio">No hay citas agendadas aún</li>
            </ul>
        </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
